<VirtualHost *:80>
    ServerName localhost
    ServerAlias php85.localhost
    DocumentRoot "/var/www/php8/public"
    DirectoryIndex index.php index.html
    <Directory "/var/www/php8/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "\\.php$">
        SetHandler "proxy:fcgi://php8:9000"
    </FilesMatch>
</VirtualHost>

