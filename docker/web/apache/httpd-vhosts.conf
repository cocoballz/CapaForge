# The port selects the PHP runtime. The URL path selects the project.
Listen 8510
Listen 8511
Listen 8512
Listen 8513
Listen 8514
Listen 8515

<Directory "/var/www">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<Directory "/usr/local/apache2/htdocs">
    Require all granted
</Directory>

<VirtualHost *:8510>
    ServerName localhost
    DocumentRoot "/var/www"
    DirectoryIndex index.php public/index.php
    Alias "/__capaforge/" "/usr/local/apache2/htdocs/"
    RewriteEngine On
    RewriteRule ^/?$ /__capaforge/index.html [PT,L]
    <FilesMatch "\\.php$">
        SetHandler "proxy:fcgi://php-fpm-5.3:9000"
    </FilesMatch>
</VirtualHost>
