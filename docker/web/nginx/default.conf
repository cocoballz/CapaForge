# The port selects the PHP runtime. The URL path selects the project.
server { listen 8500 default_server; server_name _; root /var/www; index index.php index.html; resolver 127.0.0.11 ipv6=off valid=10s; set $php_upstream php-fpm-5.3; include /etc/nginx/conf.d/capaforge-projects.inc; }
