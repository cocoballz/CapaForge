location = / {
  root /usr/share/nginx/html;
  try_files /index.html =404;
}

# Each project can use <project>/index.php or <project>/public/index.php.
location ~ ^/(?<project>[^/]+)/?$ {
  # `try_files` would otherwise serve index.php as a static download here.
  # Rewrite to the PHP location so FastCGI handles it.
  if (-f $document_root/$project/index.php) {
    rewrite ^ /$project/index.php last;
  }
  if (-f $document_root/$project/public/index.php) {
    rewrite ^ /$project/public/index.php last;
  }
  return 404;
}

location ~ \.php$ {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  fastcgi_pass $php_upstream:9000;
}

location ~ ^/(?<project>[^/]+)(?<project_path>/.*)$ {
  try_files /$project$project_path /$project/public$project_path /$project/index.php /$project/public/index.php =404;
}
