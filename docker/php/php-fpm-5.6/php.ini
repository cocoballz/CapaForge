display_errors=On
display_startup_errors=On
; Match the legacy XAMPP 5.6 default: retain errors while hiding old-library notices.
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT
; Legacy projects may send a BOM or warning before calling header().
; Match PHP's classic web-server behaviour so login redirects still work.
output_buffering=4096
auto_prepend_file=/opt/capaforge/prepend.php
log_errors=On
error_log=/proc/self/fd/2
date.timezone=America/Bogota
; Compatibility bridge for legacy mysql_pconnect('localhost:3306', ...).
; The optional xampp-db profile provides this socket and forwards to XAMPP MySQL.
mysql.default_socket=/tmp/capaforge/mysql.sock
mysqli.default_socket=/tmp/capaforge/mysql.sock
pdo_mysql.default_socket=/tmp/capaforge/mysql.sock
