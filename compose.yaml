name: capaforge

services:
  nginx:
    image: nginx:1.27-alpine
    profiles: [web]
    ports:
      - "8080:80"
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www:ro
      - ./docker/web/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php8

  apache:
    build:
      context: ./docker/web/apache
    profiles: [apache]
    ports:
      - "8081:80"
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www:ro
    depends_on:
      - php8

  php7:
    image: php:7.4-fpm-alpine
    container_name: php-fpm-7.4
    profiles: [php7]
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www
      - ./docker/php/php-fpm-7.4/php.ini:/usr/local/etc/php/conf.d/99-capa-media.ini:ro

  php71:
    image: php:7.1-fpm-alpine
    container_name: php-fpm-7.1
    profiles: [php71, legacy]
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www
      - ./docker/php/php-fpm-7.1/php.ini:/usr/local/etc/php/conf.d/99-capa-media.ini:ro

  php81:
    image: php:8.1-fpm-alpine
    container_name: php-fpm-8.1
    profiles: [php81]
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www
      - ./docker/php/php-fpm-8.1/php.ini:/usr/local/etc/php/conf.d/99-capa-media.ini:ro

  php8:
    image: php:8.5-fpm-alpine
    container_name: php-fpm-8.5
    profiles: [php8, web, apache]
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www
      - ./docker/php/php-fpm-8.5/php.ini:/usr/local/etc/php/conf.d/99-capa-media.ini:ro

  php53:
    # The official PHP image no longer publishes 5.3; this is an isolated legacy image.
    image: devilbox/php-fpm-5.3:latest
    container_name: php-fpm-5.3
    profiles: [php53, legacy]
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www

  postgres:
    image: postgres:16-alpine
    profiles: [data]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [data]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    profiles: [data]
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  workspace:
    image: alpine:3.20
    profiles: [workspace]
    working_dir: /workspace
    user: "1000:1000"
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/workspace
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  wildfly:
    image: quay.io/wildfly/wildfly:35.0.1.Final-jdk17
    profiles: [java]
    ports:
      - "8082:8080"
      - "9990:9990"
    volumes:
      - ./projects/java/deployments:/opt/wildfly/standalone/deployments
    command: ["/opt/wildfly/bin/standalone.sh", "-b", "0.0.0.0", "-bmanagement", "0.0.0.0"]

volumes:
  postgres-data:
  redis-data:
  mysql-data:
