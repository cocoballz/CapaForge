name: capaforge

services:
  nginx:
    image: nginx:1.27-alpine
    profiles: [web]
    ports:
      - "8500:8500"
      - "8501:8501"
      - "8502:8502"
      - "8503:8503"
      - "8504:8504"
      - "8505:8505"
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www:ro
      - ./docker/web/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/web/nginx/capaforge-projects.conf:/etc/nginx/conf.d/capaforge-projects.inc:ro
      - ./docker/web/welcome:/usr/share/nginx/html:ro
    depends_on:
      - php-fpm-8.5

  apache:
    build:
      context: ./docker/web
      dockerfile: apache/Dockerfile
    profiles: [apache]
    ports:
      - "8510:8510"
      - "8511:8511"
      - "8512:8512"
      - "8513:8513"
      - "8514:8514"
      - "8515:8515"
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www:ro
    depends_on:
      - php-fpm-8.5

  php-fpm-7.4:
    image: php:7.4-fpm-alpine
    profiles: [php7]
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www
      - ./docker/php/php-fpm-7.4/php.ini:/usr/local/etc/php/conf.d/99-capa-media.ini:ro

  php-fpm-7.1:
    image: php:7.1-fpm-alpine
    profiles: [php71, legacy]
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www
      - ./docker/php/php-fpm-7.1/php.ini:/usr/local/etc/php/conf.d/99-capa-media.ini:ro

  php-fpm-8.1:
    image: php:8.1-fpm-alpine
    profiles: [php81]
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www
      - ./docker/php/php-fpm-8.1/php.ini:/usr/local/etc/php/conf.d/99-capa-media.ini:ro

  php-fpm-8.5:
    image: php:8.5-fpm-alpine
    profiles: [php8, web, apache]
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www
      - ./docker/php/php-fpm-8.5/php.ini:/usr/local/etc/php/conf.d/99-capa-media.ini:ro

  php-fpm-5.3:
    # The official PHP image no longer publishes 5.3; this is an isolated legacy image.
    image: devilbox/php-fpm-5.3:latest
    profiles: [php53, legacy]
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www

  php-fpm-5.6:
    image: ${PHP56_IMAGE:-devilbox/php-fpm:5.6-prod}
    profiles: [php56, legacy]
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/var/www
      # This image loads xxx/zzz defaults, so CapaForge must load last.
      - ./docker/php/php-fpm-5.6/php.ini:/usr/local/etc/php/conf.d/zzzz-capaforge.ini:ro
      - ./docker/php/php-fpm-5.6/prepend.php:/opt/capaforge/prepend.php:ro
      - xampp-mysql-socket:/tmp/capaforge

  # Optional compatibility bridge: legacy code may keep using localhost:3306
  # while MySQL actually runs in XAMPP on the Windows host.
  xampp-mysql-php56:
    build:
      context: ./docker/network/xampp-mysql-proxy
    profiles: [xampp-db]
    network_mode: service:php-fpm-5.6
    depends_on:
      php-fpm-5.6:
        condition: service_started
    volumes:
      - xampp-mysql-socket:/tmp/capaforge
    command: ["UNIX-LISTEN:/tmp/capaforge/mysql.sock,fork,mode=666", "TCP:host.docker.internal:3306"]
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: [data]
    ports:
      - "127.0.0.1:8520:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    profiles: [data]
    ports:
      - "127.0.0.1:8522:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    profiles: [data]
    ports:
      - "127.0.0.1:8521:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  workspace:
    image: alpine:3.20
    profiles: [workspace]
    working_dir: /workspace
    user: "1000:1000"
    volumes:
      - ${PROJECTS_ROOT:-./projects}:/workspace
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  wildfly:
    image: quay.io/wildfly/wildfly:35.0.1.Final-jdk17
    profiles: [java]
    ports:
      - "8530:8080"
      - "8531:9990"
    volumes:
      - ./projects/java/deployments:/opt/wildfly/standalone/deployments
    command: ["/opt/wildfly/bin/standalone.sh", "-b", "0.0.0.0", "-bmanagement", "0.0.0.0"]

volumes:
  postgres-data:
  redis-data:
  mysql-data:
  xampp-mysql-socket:
